<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consumidor externo simulado</title>
  <style>
    :root { --bg:#0b0d12; --panel:#12151c; --line:#222733; --text:#e7eaf0; --muted:#8b93a7; --ok:#3ddc97; --warn:#ffb454; --bad:#ff6b6b; --acc:#7c8cff; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
    header { display:flex; align-items:center; gap:12px; padding:18px 24px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
    h1 { font-size:16px; margin:0; letter-spacing:.2px; }
    .pill { font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
    .live { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 0 var(--ok); animation:pulse 1.6s infinite; }
    @keyframes pulse { 70% { box-shadow:0 0 0 8px transparent; } 100% { box-shadow:0 0 0 0 transparent; } }
    .spacer { flex:1; }
    button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer; font:inherit; }
    button:hover { border-color:var(--acc); }
    main { display:grid; grid-template-columns: 1.4fr 1fr; gap:16px; padding:16px 24px 32px; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
    section { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
    section h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0; padding:12px 16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; }
    .row { display:grid; grid-template-columns: 82px 120px 1fr 54px; gap:10px; padding:9px 16px; border-bottom:1px solid var(--line); align-items:center; }
    .row:last-child { border-bottom:0; }
    .t { color:var(--muted); font-variant-numeric: tabular-nums; }
    .tag { font-size:11px; padding:1px 8px; border-radius:6px; width:fit-content; background:#1b2030; }
    .aplicado { color:var(--ok); } .falha-injetada, .assinatura-invalida { color:var(--bad); } .duplicado-ignorado, .versao-antiga-ignorada { color:var(--warn); }
    .sub { color:var(--muted); font-size:12px; }
    .empty { padding:28px 16px; color:var(--muted); text-align:center; }
    .card { padding:11px 16px; border-bottom:1px solid var(--line); display:grid; gap:2px; }
    .card:last-child { border-bottom:0; }
    .urgent { color:var(--bad); font-size:11px; font-weight:600; }
    .scroll { max-height: 70vh; overflow:auto; }
    input[type=number] { width:56px; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px; }
  </style>
</head>
<body>
  <header>
    <span class="live"></span>
    <h1>Consumidor externo simulado</h1>
    <span class="pill">somente leitura · POST /webhooks/todos</span>
    <span class="spacer"></span>
    <label class="sub">Falhar os próximos <input id="n" type="number" min="1" value="3"> recebimentos</label>
    <button id="fail">Injetar falha (503)</button>
    <span class="pill" id="pending">0 falhas pendentes</span>
    <button id="reset">Limpar</button>
  </header>
  <main>
    <section>
      <h2><span>Eventos recebidos</span><span id="count"></span></h2>
      <div id="events" class="scroll"></div>
    </section>
    <section>
      <h2><span>Estado projetado (tarefas)</span><span id="tcount"></span></h2>
      <div id="state" class="scroll"></div>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    async function refresh() {
      try {
        const [events, state] = await Promise.all([fetch('/api/events').then(r => r.json()), fetch('/api/state').then(r => r.json())]);
        $('count').textContent = events.length ? events.length + ' recentes' : '';
        $('events').innerHTML = events.length ? events.map(e => `
          <div class="row">
            <span class="t">${new Date(e.at).toLocaleTimeString()}</span>
            <span class="tag ${e.outcome}">${esc(e.outcome)}</span>
            <span>${esc(e.type)} <span class="sub">v${e.version} · ${esc(e.title ?? '')}</span></span>
            <span class="sub">#${e.attempt}</span>
          </div>`).join('') : '<div class="empty">Nenhum evento recebido ainda. Crie ou edite uma tarefa no app.</div>';

        $('tcount').textContent = state.todos.length + ' tarefas';
        $('pending').textContent = state.failuresPending + ' falhas pendentes';
        $('state').innerHTML = state.todos.length ? state.todos.map(t => `
          <div class="card">
            <div>${t.data.isUrgent ? '<span class="urgent">URGENTE </span>' : ''}${esc(t.data.title)}</div>
            <div class="sub">v${t.version} · ${esc(t.data.priority)} · ${esc(t.data.status)}${t.data.category ? ' · ' + esc(t.data.category) : ''}${t.data.dueDate ? ' · vence ' + esc(t.data.dueDate) : ''}</div>
          </div>`).join('') : '<div class="empty">Sem tarefas projetadas.</div>';
      } catch { /* servidor reiniciando */ }
    }
    $('fail').onclick = () => fetch('/admin/failures?count=' + (+$('n').value || 1), { method: 'POST' }).then(refresh);
    $('reset').onclick = () => fetch('/admin/reset', { method: 'POST' }).then(refresh);
    refresh(); setInterval(refresh, 1000);
  </script>
</body>
</html>
