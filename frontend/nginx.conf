server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # API: o mesmo origin do app (sem CORS, e o service worker não intercepta /api).
  # Resolvedor do Docker + variável: o nginx volta a resolver "api" se o container reiniciar com outro IP.
  location /api/ {
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream http://api:8080;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
  }

  # O service worker e o manifesto de versões NUNCA podem ficar em cache HTTP, senão o app não atualiza.
  location = /ngsw-worker.js { add_header Cache-Control "no-cache"; }
  location = /ngsw.json      { add_header Cache-Control "no-cache"; }
  location = /index.html     { add_header Cache-Control "no-cache"; }

  # Arquivos com hash no nome: cache longo.
  location ~* \.(js|css|woff2|png|svg|ico)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA: qualquer rota cai no index.html
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
